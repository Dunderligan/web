name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `svelte-kit sync` types the `$env/static/*` imports from the env vars it can see,
      # so the example file needs to be present for `pnpm check` to resolve them.
      - name: Set up environment variables
        run: cp .env.example .env

      - name: Typecheck
        run: pnpm check

      # Needs the `.svelte-kit` output that the typecheck step generates.
      - name: Lint
        run: pnpm lint
